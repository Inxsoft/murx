# MURX end-to-end demo: one MURX server, two backend nodes, one client.
#
#   docker compose up --build --abort-on-container-exit --exit-code-from client
#
# The nodes announce their compose service names, so the client is
# redirected to a DNS name (erp-1 / erp-2) resolved by Docker's DNS.
#
# Demo secrets only. Generate real ones with:
#   python -c "import secrets; print(secrets.token_hex(32))"

services:
  murx-server:
    build: .
    command: server
    init: true
    environment:
      NODE_SECRETS: "erp-1:6c2f0e4d9a1b7c3e5f60718293a4b5c6d7e8f90112233445566778899aabbccd,erp-2:a1b2c3d4e5f60718293a4b5c6d7e8f9011223344556677889900aabbccddeeff"

  erp-1:
    build: .
    command: node
    init: true
    environment:
      NODE_ID: erp-1
      NODE_SECRET: "6c2f0e4d9a1b7c3e5f60718293a4b5c6d7e8f90112233445566778899aabbccd"
      NODE_CAPACITY: "100"
    depends_on: [murx-server]

  erp-2:
    build: .
    command: node
    init: true
    environment:
      NODE_ID: erp-2
      NODE_SECRET: "a1b2c3d4e5f60718293a4b5c6d7e8f9011223344556677889900aabbccddeeff"
      NODE_CAPACITY: "50"
    depends_on: [murx-server]

  client:
    build: .
    command: client
    init: true
    depends_on: [erp-1, erp-2]
