[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "murx"
version = "0.1.0"
description = "Reference implementation of the MURX (Multi-User Resource eXchange) authenticated routing gateway protocol"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Thomas Kuiper" }]

[project.optional-dependencies]
srv = ["dnspython>=2.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["murx*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
